name: Deploy to Chrome Web Store

# 버전 태그를 밀거나 수동 실행할 때 Chrome Web Store API v2로 제출.
#
# 필요한 리포지토리 시크릿 (Settings → Secrets and variables → Actions):
#   CHROME_EXTENSION_ID   웹스토어 확장 ID
#   CHROME_PUBLISHER_ID   웹스토어 게시자 ID
#   CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL  Google Cloud 서비스 계정 이메일
#   CHROME_SERVICE_ACCOUNT_PRIVATE_KEY   서비스 계정 JSON 키의 private_key
# 발급 절차는 docs/deploy.md 참고.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '인증·빌드를 검증하고 웹스토어 업로드는 건너뜀'
        type: boolean
        default: true
      skip_review:
        description: '업로드만 하고 심사 제출은 보류 (웹스토어 draft로 둠)'
        type: boolean
        default: false

# 배포 잡이 겹치면 웹스토어 API가 충돌하므로 직렬화. 진행 중인 건 취소하지 않음.
concurrency:
  group: chrome-web-store-deploy
  cancel-in-progress: false

permissions:
  contents: write  # 태그 배포 시 GitHub 릴리스 생성

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4  # 버전은 package.json의 packageManager에서 읽음

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 사전 검사 (ko.json 키 충돌·패턴 오류)
        run: pnpm dict

      - name: 타입 검사
        run: pnpm typecheck

      - name: 태그와 package.json 버전 일치 확인
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION / package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::태그($TAG_VERSION)와 package.json 버전($PKG_VERSION)이 다릅니다. package.json을 먼저 올리고 태그를 다시 다세요."
            exit 1
          fi

      - name: 빌드 + zip
        run: pnpm zip

      - name: zip 경로 계산
        id: zip
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          PATH_="$(ls .output/${NAME}-${VERSION}-chrome.zip)"
          echo "path=$PATH_" >> "$GITHUB_OUTPUT"
          echo "zip: $PATH_"

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3-zip
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

      - name: Chrome Web Store API v2 제출
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_SKIP_SUBMIT_REVIEW: ${{ inputs.skip_review }}
        run: |
          for key in CHROME_EXTENSION_ID CHROME_PUBLISHER_ID CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL CHROME_SERVICE_ACCOUNT_PRIVATE_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing repository secret: $key"
              exit 1
            fi
          done
          if [ "${{ inputs.dry_run }}" = 'true' ]; then
            pnpm submit --dry-run
          else
            pnpm submit
          fi

      - name: GitHub 릴리스
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.path }}
          generate_release_notes: true
